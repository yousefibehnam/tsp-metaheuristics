[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tspmh"
version = "1.0.0"
description = "Genetic algorithm and simulated annealing for the TSP, written from scratch, on TSPLIB instances."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Behnam Yousefi" }]
dependencies = ["numpy>=2.0", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
tspmh = "tspmh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
